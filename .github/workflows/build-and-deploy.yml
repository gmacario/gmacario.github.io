# Build and deploy the Astro site to GitHub Pages.
#
# Astro migration, issue #62. Replaces the legacy Next.js export + gh-pages
# branch deploy. The Astro project lives at the repository root, so
# withastro/action uses its default path (".").
#
# NOTE (cutover prerequisite): this workflow deploys via the GitHub Pages
# "GitHub Actions" source. Before the first production deploy, set
# Settings -> Pages -> Build and deployment -> Source to "GitHub Actions"
# (the old site used the "Deploy from a branch: gh-pages" source).
name: Deploy Astro site to GitHub Pages

on:
  # Production deploy happens only on the default branch (the cutover merge).
  push:
    branches: [main]
  # On pull requests the site is built but NOT deployed — this is the
  # PR preview/verification capability (replaces the defunct Heroku staging).
  pull_request:
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single concurrent production deployment; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Cloudflare Web Analytics beacon token (#131). Stored as a repository
          # variable, not a secret: Cloudflare embeds it in the page markup, so
          # it is public by design. Keeping it here rather than in
          # astro-paper.config.ts means Netlify staging/preview builds never
          # receive it, so their traffic stays out of the production statistics.
          # When the variable is unset the beacon is simply omitted.
          PUBLIC_CLOUDFLARE_BEACON_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_BEACON_TOKEN }}

  deploy:
    # Deploy to production only from the default branch, never from a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
