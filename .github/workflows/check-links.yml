name: Check Links

on:
  push:
    paths:
      - ".github/workflows/check-links.yml"
      - ".linkspector.yml"
      - "**.md"
  pull_request:
    paths:
      - ".github/workflows/check-links.yml"
      - ".linkspector.yml"
      - "**.md"
  schedule:
    # Run every Tuesday at 3 AM UTC to catch breakage caused by changes to the linked sites.
    - cron: "0 3 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install linkspector
        run: npm install -g @umbrelladocs/linkspector

      - name: Check links
        run: linkspector check

# EOF
